name: Validate public profiles
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: profiles
      - uses: actions/checkout@v4
        with:
          repository: johnhenning/outfit
          ref: main
          path: outfit
      - uses: actions/setup-go@v7
        with:
          go-version-file: outfit/go.mod
      - working-directory: outfit
        run: go run ./cmd/outfit catalog --source ../profiles --json
      - working-directory: outfit
        shell: bash
        run: |
          for target in macos-arm64 macos-amd64 debian-amd64 debian-arm64 fedora-amd64 fedora-arm64 windows-amd64 windows-arm64; do
            for profile in workstation dev compute media; do
              go run ./cmd/outfit plan --source ../profiles --profile "$profile" --target "$target" --json > /dev/null
            done
          done
